name: Nemotron Prompt Budget

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/arcsolver/nvarc_protocol.py'
      - 'scripts/profile_nemotron_prompt_tokens.py'
      - 'experiments/evaluation_split_v2.json'
      - '.github/workflows/nemotron-prompt-budget.yml'
  push:
    branches: [main]
    paths:
      - 'src/arcsolver/nvarc_protocol.py'
      - 'scripts/profile_nemotron_prompt_tokens.py'
      - 'experiments/evaluation_split_v2.json'
      - '.github/workflows/nemotron-prompt-budget.yml'

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout ARC-AGI-2 public data
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          path: official-arc-agi-2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and tokenizer runtime
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'transformers==4.57.6' 'tokenizers>=0.22,<0.23'

      - name: Profile public-evaluation transductive prompts
        run: >-
          python scripts/profile_nemotron_prompt_tokens.py
          official-arc-agi-2/data/evaluation
          experiments/evaluation_split_v2.json
          --mode transductive
          --json-out experiments/nemotron_transductive_prompt_budget.json

      - name: Upload prompt budget
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-prompt-budget
          path: experiments/nemotron_transductive_prompt_budget.json
