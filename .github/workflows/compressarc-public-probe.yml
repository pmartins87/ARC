name: CompressARC Public Artifact Provenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe_compressarc_artifact.py'
      - 'scripts/make_split.py'
      - 'pyproject.toml'
      - '.github/workflows/compressarc-public-probe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/probe_compressarc_artifact.py'
      - 'scripts/make_split.py'
      - 'pyproject.toml'
      - '.github/workflows/compressarc-public-probe.yml'

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ARC project
        uses: actions/checkout@v4

      - name: Checkout frozen CompressARC public artifact source
        uses: actions/checkout@v4
        with:
          repository: iliao2345/CompressARC
          ref: 83a22218024d46273eb32b769a906340202ffb4d
          path: external-compressarc

      - name: Checkout official ARC-AGI-2 task data
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          path: official-arc-agi-2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create frozen split from official 120-task ARC-AGI-2 evaluation
        run: >-
          python scripts/make_split.py
          official-arc-agi-2/data/evaluation
          experiments/compressarc_eval_split_v1.json
          --profile evaluation
          --seed arc-2026-v1

      - name: Audit task-set provenance before any score claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          official_dir = Path('official-arc-agi-2/data/evaluation')
          official_ids = {p.stem for p in official_dir.glob('*.json')}
          challenges = json.loads(Path('external-compressarc/dataset/arc-agi_evaluation_challenges.json').read_text())
          source_ids = set(challenges)
          overlap = sorted(official_ids & source_ids)
          missing = sorted(official_ids - source_ids)
          source_only = sorted(source_ids - official_ids)
          report = {
              'official_arc_agi_2_evaluation_tasks': len(official_ids),
              'compressarc_artifact_source_tasks': len(source_ids),
              'overlap_tasks': len(overlap),
              'missing_official_tasks': len(missing),
              'overlap_task_ids': overlap,
              'missing_official_task_ids': missing,
              'source_only_task_count': len(source_only),
              'verdict': 'INCOMPATIBLE_FOR_CURRENT_ARC_AGI_2_COVERAGE' if missing else 'FULL_OVERLAP',
          }
          Path('experiments/compressarc_public_artifact_provenance.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: compressarc-public-provenance
          path: |
            experiments/compressarc_eval_split_v1.json
            experiments/compressarc_public_artifact_provenance.json
