name: Representative ARC Probe Pack

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/arcsolver/representative_probe.py'
      - 'scripts/select_representative_probe_pack.py'
      - 'tests/test_representative_probe.py'
      - 'experiments/evaluation_split_v2.json'
      - '.github/workflows/representative-probe-pack.yml'
  push:
    branches: [main]
    paths:
      - 'src/arcsolver/representative_probe.py'
      - 'scripts/select_representative_probe_pack.py'
      - 'experiments/evaluation_split_v2.json'
      - '.github/workflows/representative-probe-pack.yml'

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout ARC-AGI-2 public data
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          path: official-arc-agi-2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Select 8-task development probe pack
        run: >-
          python scripts/select_representative_probe_pack.py
          official-arc-agi-2/data/evaluation
          experiments/evaluation_split_v2.json
          --split development
          --count 8
          --json-out experiments/e0006_representative_dev_probe_pack.json

      - name: Upload probe pack
        uses: actions/upload-artifact@v4
        with:
          name: representative-dev-probe-pack
          path: experiments/e0006_representative_dev_probe_pack.json
