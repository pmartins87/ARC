[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcsolver"
version = "0.1.0"
description = "Research infrastructure for ARC Prize 2026 ARC-AGI-2"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=2,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
